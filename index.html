<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    <div class="score-box">
      <div class="score-label">Score</div>
      <div class="score-value" id="score-display">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Best</div>
      <div class="score-value" id="best-display">0</div>
    </div>
  </div>

  <div id="game-wrapper">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2>SNAKE</h2>
      <p>Use arrow keys or WASD to move</p>
      <button id="restart-btn">Start Game</button>
    </div>
  </div>

  <div id="controls-hint">Arrow Keys / WASD &nbsp;|&nbsp; R to Restart</div>

  <!-- Load order matters: constants → rendering → UI → game logic → input -->
  <script src="js/config.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/input.js"></script>
</body>
</html>
