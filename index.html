<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 48px;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .score-box {
      text-align: center;
    }

    .score-label {
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .score-value {
      font-size: 2rem;
      font-weight: bold;
      color: #4ecca3;
    }

    #game-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
      background: #0f0f23;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 15, 35, 0.88);
      border-radius: 4px;
      gap: 16px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #e94560;
      letter-spacing: 3px;
    }

    #overlay p {
      color: #aaa;
      font-size: 1rem;
    }

    #overlay .final-score {
      font-size: 1.4rem;
      color: #4ecca3;
    }

    #restart-btn {
      margin-top: 8px;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: transparent;
      color: #4ecca3;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #restart-btn:hover {
      background: #4ecca3;
      color: #0f0f23;
    }

    #controls-hint {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    <div class="score-box">
      <div class="score-label">Score</div>
      <div class="score-value" id="score-display">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Best</div>
      <div class="score-value" id="best-display">0</div>
    </div>
  </div>

  <div id="game-wrapper">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2>SNAKE</h2>
      <p>Use arrow keys or WASD to move</p>
      <button id="restart-btn">Start Game</button>
    </div>
  </div>

  <div id="controls-hint">Arrow Keys / WASD &nbsp;|&nbsp; R to Restart</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreDisplay = document.getElementById('score-display');
    const bestDisplay = document.getElementById('best-display');
    const restartBtn = document.getElementById('restart-btn');

    const COLS = 20;
    const ROWS = 20;
    const CELL = canvas.width / COLS;
    const TICK_MS = 120;

    let snake, dir, nextDir, food, score, best, gameLoop, running;

    best = 0;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      running = true;
      updateScoreDisplay();
      placeFood();
      overlay.style.display = 'none';
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, TICK_MS);
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      dir = nextDir;

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return endGame();
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score > best) best = score;
        updateScoreDisplay();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1a1a3e';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
        }
      }

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      // Food glow
      ctx.shadowColor = '#e94560';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake body
      snake.forEach((seg, i) => {
        const x = seg.x * CELL + 2;
        const y = seg.y * CELL + 2;
        const size = CELL - 4;
        const radius = i === 0 ? 6 : 4;

        if (i === 0) {
          ctx.fillStyle = '#4ecca3';
          ctx.shadowColor = '#4ecca3';
          ctx.shadowBlur = 8;
        } else {
          const lightness = Math.max(30, 60 - i * 2);
          ctx.fillStyle = `hsl(162, 60%, ${lightness}%)`;
          ctx.shadowBlur = 0;
        }

        roundRect(ctx, x, y, size, size, radius);
        ctx.fill();
      });

      ctx.shadowBlur = 0;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function endGame() {
      running = false;
      clearInterval(gameLoop);

      overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p class="final-score">Score: ${score}</p>
        <p style="color:#888">Best: ${best}</p>
        <button id="restart-btn">Play Again</button>
        <p style="font-size:0.8rem;color:#555">Press R to restart</p>
      `;
      overlay.style.display = 'flex';
      document.getElementById('restart-btn').addEventListener('click', init);
    }

    function updateScoreDisplay() {
      scoreDisplay.textContent = score;
      bestDisplay.textContent = best;
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':    case 'w': case 'W':
          if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; break;
        case 'ArrowDown':  case 's': case 'S':
          if (dir.y !== -1) nextDir = { x: 0, y: 1 };  break;
        case 'ArrowLeft':  case 'a': case 'A':
          if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D':
          if (dir.x !== -1) nextDir = { x: 1, y: 0 };  break;
        case 'r': case 'R':
          init(); break;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
    });

    restartBtn.addEventListener('click', init);

    // Draw empty board on load
    ctx.fillStyle = '#0f0f23';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
